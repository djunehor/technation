<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Technation Assessor</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Technation Assessor</h1>
            <div class="actions">
                <button class="btn-upload" onclick="document.getElementById('fileInput').click()">
                    Upload Evidence
                    <input type="file" id="fileInput" multiple hidden>
                    <input type="file" id="folderInput" webkitdirectory directory hidden>
                </button>
            </div>
        </header>

        <div id="dropZone" class="drop-zone">
            <div class="drop-zone-content">
                <span class="icon">📁</span>
                <p>Drag & Drop files or folders here</p>
                <p class="small">or <span class="link" onclick="document.getElementById('fileInput').click()">browse files</span> or <span class="link" onclick="document.getElementById('folderInput').click()">browse folders</span></p>
            </div>
        </div>

        <div id="status" class="status-line">Ready to assess documents</div>

        <div id="mainContent" class="content-area">
            <!-- Real-time logs and results will stream here -->
        </div>
    </div>
    <script type="module" src="main.js"></script>
</body>
</html>
